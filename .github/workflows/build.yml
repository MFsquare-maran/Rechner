name: Build EXE

on:
  push:
    tags:
      - 'V*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: PyInstaller installieren
        run: pip install pyinstaller

      - name: EXE bauen
        run: pyinstaller --onefile --windowed --name Rechner rechner.py

      - name: Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Rechner.exe
